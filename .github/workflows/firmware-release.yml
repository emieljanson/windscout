name: WindScout firmware

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run host tests
        run: make -C firmware test

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build embedded web interface
        working-directory: firmware
        run: python3 build.py --step webapp

      - name: Select firmware version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build reTerminal E1002 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.0
          target: esp32s3
          path: firmware
          command: >-
            python3 build.py --board seeedstudio_reterminal_e1002 --step firmware
            -DFIRMWARE_VERSION='${{ steps.version.outputs.value }}'

      - name: Prepare firmware artifacts
        run: |
          mkdir -p release
          cp firmware/build/windscout.bin release/windscout-seeedstudio_reterminal_e1002.bin
          python3 firmware/scripts/generate_installer_manifest.py \
            --build-dir firmware/build \
            --partitions firmware/partitions.csv \
            --output release/installer \
            --version '${{ steps.version.outputs.value }}'

      - uses: actions/upload-artifact@v4
        with:
          name: windscout-firmware
          path: release/

      - name: Publish tagged firmware
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            release/windscout-seeedstudio_reterminal_e1002.bin
            release/installer/latest.json
            release/installer/${{ steps.version.outputs.value }}/*
          generate_release_notes: true
